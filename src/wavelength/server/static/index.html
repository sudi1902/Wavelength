<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavelength — Sound Effects Library</title>
<style>
  /* ── Studio-hardware dark. Warm charcoal ground, VU-meter amber accent. ── */
  :root {
    --bg: #14120f;
    --bg-glow: radial-gradient(1200px 500px at 50% -10%, #241d12 0%, transparent 60%);
    --surface: #1c1916;
    --surface-2: #262119;
    --line: #362f25;
    --line-soft: #2a251d;
    --text: #ece5d8;
    --dim: #9c9184;
    --faint: #6d6459;
    --amber: #ffb454;
    --amber-deep: #e08a1e;
    --amber-glow: rgba(255, 180, 84, 0.14);
    --good: #8fd68f;
    --bad: #e5695f;
    --warn: #e8c468;
    --radius: 14px;
    --font-display: "Avenir Next", "Futura", "Helvetica Neue", system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    background-image: var(--bg-glow);
    background-repeat: no-repeat;
    color: var(--text);
    font: 14px/1.55 var(--font-body);
    min-height: 100vh;
  }
  button { font-family: var(--font-body); }

  /* ── header ─────────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    max-width: 1180px; margin: 0 auto; padding: 26px 26px 0;
  }
  .brand {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 600; letter-spacing: .06em;
  }
  .brand em { font-style: normal; color: var(--amber); }
  .leds {
    display: flex; gap: 14px; margin-left: auto;
    font-family: var(--font-mono); font-size: 10.5px; color: var(--dim);
    letter-spacing: .08em; text-transform: uppercase;
  }
  .led { display: flex; align-items: center; gap: 6px; }
  .led i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--faint);
    box-shadow: none;
  }
  .led.on i { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .led.count i { background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 26px 90px; }

  /* ── extract bar ────────────────────────────────────────────────────── */
  .extract-box { display: flex; gap: 10px; margin: 6px 0 14px; }
  .extract-box input[type=text] {
    flex: 1; padding: 13px 18px; font-size: 14.5px;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface); color: var(--text);
    font-family: var(--font-body);
  }
  .extract-box input::placeholder { color: var(--faint); }
  .extract-box input:focus { outline: none; border-color: var(--amber-deep); }
  .btn-amber {
    padding: 0 22px; border: none; border-radius: var(--radius);
    background: linear-gradient(180deg, var(--amber), var(--amber-deep));
    color: #1c1200; font-weight: 700; font-size: 14px; letter-spacing: .02em;
    cursor: pointer;
  }
  .btn-amber:hover { filter: brightness(1.08); }

  /* ── jobs ───────────────────────────────────────────────────────────── */
  .jobs:not(:empty) { margin-bottom: 16px; display: grid; gap: 6px; }
  .job {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 8px 14px;
    font-family: var(--font-mono); font-size: 12px;
  }
  .job .target { color: var(--text); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 60%; }
  .job .state-running { color: var(--amber); }
  .job .state-queued { color: var(--dim); }
  .job .state-done { color: var(--good); }
  .job .state-error { color: var(--bad); }
  .job .log { flex-basis: 100%; color: var(--dim); }
  @keyframes blink { 50% { opacity: .35; } }
  .job .state-running::before {
    content: "●"; margin-right: 6px; animation: blink 1.1s infinite;
  }

  /* ── toolbar ────────────────────────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .tabs {
    display: flex; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px;
  }
  .tabs button {
    border: none; background: none; color: var(--dim); cursor: pointer;
    padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  .tabs button.active { background: var(--surface-2); color: var(--amber); }
  #search {
    padding: 8px 16px; width: 250px; font-size: 13.5px;
    border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-family: var(--font-body);
  }
  #search::placeholder { color: var(--faint); }
  #search:focus { outline: none; border-color: var(--amber-deep); }
  .watch {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; color: var(--dim);
    letter-spacing: .04em;
  }
  .watch input { accent-color: var(--amber); }

  /* ── sound card grid ────────────────────────────────────────────────── */
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--radius); padding: 16px 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--line); transform: translateY(-1px); }
  .card.playing { border-color: var(--amber-deep); }
  .card.expanded { grid-column: 1 / -1; }

  .card-head { display: flex; align-items: center; gap: 10px; }
  .label {
    font-family: var(--font-display); font-weight: 600; font-size: 16.5px;
    letter-spacing: .01em; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; cursor: text;
  }
  .label input {
    background: var(--surface-2); border: 1px solid var(--amber-deep);
    color: var(--text); border-radius: 8px; padding: 2px 8px; width: 150px;
    font: 600 14px var(--font-display);
  }
  .conf { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
  .fav {
    margin-left: auto; background: none; border: none; cursor: pointer;
    font-size: 15px; color: var(--faint); padding: 2px 4px;
  }
  .fav.on { color: var(--amber); text-shadow: 0 0 8px var(--amber-glow); }

  .wave-wrap { position: relative; }
  canvas.wave {
    width: 100%; height: 54px; display: block; cursor: pointer;
    background: #171411; border-radius: 8px;
  }
  .play {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(180deg, var(--amber), var(--amber-deep));
    color: #1c1200; font-size: 13px;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
    transition: transform .12s;
  }
  .play:hover { transform: translateY(-50%) scale(1.06); }
  .play.playing { background: var(--surface-2); color: var(--amber);
    border: 1px solid var(--amber-deep); }

  .meta-row {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 10.5px; color: var(--dim);
    letter-spacing: .03em;
  }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; cursor: pointer; min-width: 0; }
  .tag {
    background: var(--surface-2); border-radius: 999px; padding: 1px 9px;
    font-size: 10px; color: var(--amber); font-family: var(--font-mono);
  }
  .tag.ghost { opacity: .4; color: var(--dim); }

  .card-foot {
    display: flex; align-items: center; gap: 6px;
    border-top: 1px solid var(--line-soft); padding-top: 9px; margin-top: 2px;
  }
  .source-line {
    font-size: 11px; color: var(--faint); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .source-line a { color: var(--faint); }
  .source-line a:hover { color: var(--dim); }
  .card-actions { margin-left: auto; display: flex; gap: 5px; flex: none; }
  .chip {
    border: 1px solid var(--line); background: none; color: var(--dim);
    border-radius: 8px; padding: 3px 10px; font-size: 11.5px; cursor: pointer;
    font-family: var(--font-mono); text-decoration: none; display: inline-block;
  }
  .chip:hover { border-color: var(--amber-deep); color: var(--amber); }
  .chip.danger:hover { border-color: var(--bad); color: var(--bad); }
  .chip.sparkle { color: var(--amber); border-color: var(--line); }

  .reason {
    font-family: var(--font-mono); font-size: 11px; color: var(--warn);
  }

  /* ── find-cleaner panel ─────────────────────────────────────────────── */
  .similar-panel {
    border-top: 1px dashed var(--line); padding-top: 10px;
    display: grid; gap: 4px;
  }
  .similar-panel .hint { font-size: 12px; color: var(--dim); padding: 2px 4px; }
  .cand {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px;
    border-radius: 10px; font-size: 12.5px;
  }
  .cand:hover { background: var(--surface-2); }
  .cand .cplay {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--amber); cursor: pointer;
    font-size: 10px; flex: none;
  }
  .cand .cplay.playing { background: var(--amber); color: #1c1200; }
  .cand .sim {
    font-family: var(--font-mono); color: var(--good); min-width: 42px;
    text-align: right; font-size: 11.5px;
  }
  .cand .name {
    font-weight: 600; color: var(--text); text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 300px;
  }
  .cand .name:hover { color: var(--amber); }
  .cand .by { color: var(--faint); font-size: 11px; white-space: nowrap; }
  .lic {
    border-radius: 999px; padding: 0 9px; font-size: 10px;
    font-family: var(--font-mono); border: 1px solid var(--line); color: var(--dim);
    flex: none;
  }
  .lic.cc0 { color: var(--good); border-color: rgba(143, 214, 143, .4); }
  .grow { flex: 1; }

  .empty {
    grid-column: 1 / -1; text-align: center; color: var(--dim);
    padding: 70px 0; font-size: 14px;
  }
  .empty .big { font-family: var(--font-display); font-size: 19px;
    color: var(--text); margin-bottom: 6px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--amber-deep);
    color: var(--text); border-radius: 10px; padding: 9px 20px; z-index: 10;
    font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">wave<em>length</em></div>
  <div class="leds">
    <span class="led count"><i></i><span id="led-count">0 sounds</span></span>
    <span class="led" id="led-engine"><i></i><span>engine</span></span>
    <span class="led" id="led-labels"><i></i><span>labels</span></span>
  </div>
</header>
<main>
  <div class="extract-box">
    <input type="text" id="target"
      placeholder="Paste a TikTok or Instagram link — the sound effects come out here">
    <button class="btn-amber" id="extract-btn">Extract</button>
  </div>

  <div class="jobs" id="jobs"></div>

  <div class="toolbar">
    <div class="tabs">
      <button id="tab-library" class="active">Library</button>
      <button id="tab-quarantine">Quarantine <span id="qcount"></span></button>
    </div>
    <input type="text" id="search" placeholder="Search sounds…">
    <label class="watch">
      <input type="checkbox" id="watch-toggle">
      watch <span id="watch-folder">~/Downloads</span>
    </label>
  </div>

  <div id="list" class="grid"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let tab = "library";
let audioCtx = null;
let current = { audio: null, btn: null, card: null, canvas: null, effectId: null, raf: null };
const waveCache = new Map();

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}),
});

/* ── status LEDs ─────────────────────────────────────────────────────── */
let isPublic = false;
async function refreshStatus() {
  try {
    const s = await api("/api/status");
    isPublic = s.public;
    $("#led-count").textContent =
      `${s.library_count} sound${s.library_count === 1 ? "" : "s"}`;
    $("#led-engine").classList.toggle("on", s.engine_ready);
    $("#led-engine").querySelector("span").textContent = `engine ${s.engine}`;
    $("#led-labels").classList.toggle("on", s.labeler_ready);
    $("#qcount").textContent = s.quarantine_count ? `(${s.quarantine_count})` : "";
    if (isPublic) {
      // Internet mode: no watch folders, and the library lives in this
      // browser's session.
      document.querySelector(".watch").style.display = "none";
      $("#target").placeholder =
        "Paste a TikTok or Instagram link — its sound effects become yours";
    }
  } catch {}
}

/* ── playback with sweeping playhead ─────────────────────────────────── */
function stopCurrent() {
  if (current.raf) cancelAnimationFrame(current.raf);
  if (current.audio) { current.audio.pause(); }
  if (current.btn) { current.btn.classList.remove("playing"); current.btn.textContent = "▶"; }
  if (current.card) current.card.classList.remove("playing");
  if (current.canvas && current.effectId != null) {
    drawPeaks(current.canvas, waveCache.get(current.effectId), -1);
  }
  current = { audio: null, btn: null, card: null, canvas: null, effectId: null, raf: null };
}

function playEffect(e, btn, card, canvas) {
  if (current.btn === btn) { stopCurrent(); return; }
  stopCurrent();
  const audio = new Audio(`/api/effects/${e.id}/audio`);
  audio.onended = stopCurrent;
  audio.play();
  btn.classList.add("playing"); btn.textContent = "◼";
  card.classList.add("playing");
  current = { audio, btn, card, canvas, effectId: e.id, raf: null };

  const sweep = () => {
    if (current.audio !== audio) return;
    const progress = audio.duration ? audio.currentTime / audio.duration : 0;
    drawPeaks(canvas, waveCache.get(e.id), progress);
    current.raf = requestAnimationFrame(sweep);
  };
  current.raf = requestAnimationFrame(sweep);
}

/* ── waveform ────────────────────────────────────────────────────────── */
function drawPeaks(canvas, peaks, progress) {
  if (!peaks) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth * dpr, h = 54 * dpr;
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  const bw = w / peaks.length;
  const playedUpTo = progress >= 0 ? progress * peaks.length : -1;
  peaks.forEach((p, i) => {
    const bh = Math.max(2 * dpr, p * h * 0.88);
    ctx.fillStyle = i <= playedUpTo ? "#ffb454" : "#7a5b2e";
    ctx.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - 1.4 * dpr), bh);
  });
  if (progress >= 0) {
    ctx.fillStyle = "#ffd9a0";
    ctx.fillRect(progress * w - dpr, 4 * dpr, 2 * dpr, h - 8 * dpr);
  }
}

async function loadWave(e, canvas) {
  try {
    let peaks = waveCache.get(e.id);
    if (!peaks) {
      const buf = await (await fetch(`/api/effects/${e.id}/audio`)).arrayBuffer();
      audioCtx = audioCtx || new AudioContext();
      const decoded = await audioCtx.decodeAudioData(buf);
      const data = decoded.getChannelData(0);
      const n = 220, step = Math.floor(data.length / n) || 1;
      peaks = [];
      for (let i = 0; i < n; i++) {
        let max = 0;
        for (let j = i * step; j < (i + 1) * step && j < data.length; j++) {
          const v = Math.abs(data[j]); if (v > max) max = v;
        }
        peaks.push(max);
      }
      waveCache.set(e.id, peaks);
    }
    drawPeaks(canvas, peaks, -1);
  } catch {}
}

/* ── sound card ──────────────────────────────────────────────────────── */
function effectCard(e) {
  const card = document.createElement("div");
  card.className = "card";

  /* head: label · confidence · favorite */
  const head = document.createElement("div");
  head.className = "card-head";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = e.label || "unlabeled";
  label.title = "Double-click to rename";
  label.ondblclick = () => {
    const input = document.createElement("input");
    input.value = e.label || "";
    label.replaceChildren(input); input.focus();
    const save = async () => {
      try {
        const updated = await post(`/api/effects/${e.id}/rename`, { label: input.value });
        e.label = updated.label;
        label.textContent = updated.label || "unlabeled";
        toast("Renamed");
      } catch (err) { toast(err.message); label.textContent = e.label || "unlabeled"; }
    };
    input.onkeydown = (ev) => {
      if (ev.key === "Enter") input.blur();
      if (ev.key === "Escape") { input.value = e.label || ""; input.blur(); }
    };
    input.onblur = save;
  };

  const conf = document.createElement("span");
  conf.className = "conf";
  if (e.confidence) conf.textContent = `${Math.round(e.confidence * 100)}%`;

  const fav = document.createElement("button");
  fav.className = "fav" + (e.favorite ? " on" : "");
  fav.textContent = "★"; fav.setAttribute("aria-label", "favorite");
  fav.onclick = async () => {
    try {
      const updated = await post(`/api/effects/${e.id}/favorite`, { favorite: !e.favorite });
      e.favorite = updated.favorite; fav.classList.toggle("on", e.favorite);
    } catch (err) { toast(err.message); }
  };
  head.append(label, conf, fav);

  /* waveform + play */
  const waveWrap = document.createElement("div");
  waveWrap.className = "wave-wrap";
  const wave = document.createElement("canvas");
  wave.className = "wave";
  const play = document.createElement("button");
  play.className = "play"; play.textContent = "▶";
  play.setAttribute("aria-label", "play");
  play.onclick = () => playEffect(e, play, card, wave);
  wave.onclick = () => playEffect(e, play, card, wave);
  waveWrap.append(wave, play);

  /* meta: duration · rate · tags */
  const meta = document.createElement("div");
  meta.className = "meta-row";
  const dur = document.createElement("span");
  dur.textContent = `${e.duration_s.toFixed(2)}s · ${(e.sample_rate / 1000).toFixed(1)}k`;

  const tags = document.createElement("div");
  tags.className = "tags";
  tags.title = "Click to edit tags";
  const renderTags = (list) => {
    tags.replaceChildren(...list.map(t => {
      const s = document.createElement("span"); s.className = "tag"; s.textContent = t;
      return s;
    }));
    if (!list.length) {
      const s = document.createElement("span");
      s.className = "tag ghost"; s.textContent = "+ tags";
      tags.append(s);
    }
  };
  renderTags(e.tags);
  tags.onclick = async () => {
    const val = prompt("Tags (comma-separated):", e.tags.join(","));
    if (val === null) return;
    try {
      const updated = await post(`/api/effects/${e.id}/tags`,
        { tags: val.split(",").map(t => t.trim()).filter(Boolean) });
      e.tags = updated.tags; renderTags(e.tags);
    } catch (err) { toast(err.message); }
  };
  meta.append(dur, tags);

  /* quarantine reason */
  card.append(head, waveWrap, meta);
  if (e.status === "quarantine" && e.quarantine_reason) {
    const r = document.createElement("div");
    r.className = "reason";
    r.textContent = `⚠ flagged as ${e.quarantine_reason}`;
    card.append(r);
  }

  /* footer: source · actions */
  const foot = document.createElement("div");
  foot.className = "card-foot";
  const src = document.createElement("div");
  src.className = "source-line";
  const title = e.source.title || e.source.filename;
  const by = e.source.uploader ? ` — @${e.source.uploader}` : "";
  if (e.source.url) {
    const a = document.createElement("a");
    a.href = e.source.url; a.target = "_blank"; a.rel = "noreferrer";
    a.textContent = title + by;
    src.append(a);
  } else {
    src.textContent = `${title}${by}`;
  }

  const actions = document.createElement("div");
  actions.className = "card-actions";

  if (e.status === "library") {
    const cleaner = document.createElement("button");
    cleaner.className = "chip sparkle"; cleaner.textContent = "✨ cleaner";
    cleaner.title = "Find studio-quality versions of this sound on Freesound";
    cleaner.onclick = () => toggleSimilar(e, card, cleaner);
    actions.append(cleaner);
  }
  if (e.status === "quarantine") {
    const promote = document.createElement("button");
    promote.className = "chip"; promote.textContent = "promote";
    promote.onclick = async () => {
      try {
        await post(`/api/effects/${e.id}/promote`);
        card.remove(); refreshStatus(); toast("Promoted to library");
      } catch (err) { toast(err.message); }
    };
    actions.append(promote);
  }

  const dlWav = document.createElement("a");
  dlWav.className = "chip"; dlWav.textContent = "wav";
  dlWav.href = `/api/effects/${e.id}/download`;
  const dlMp3 = document.createElement("a");
  dlMp3.className = "chip"; dlMp3.textContent = "mp3";
  dlMp3.href = `/api/effects/${e.id}/download?mp3=1`;

  const del = document.createElement("button");
  del.className = "chip danger"; del.textContent = "✕";
  del.setAttribute("aria-label", "delete");
  del.onclick = async () => {
    if (!confirm(`Delete "${e.label || e.filename}"?`)) return;
    try {
      await api(`/api/effects/${e.id}`, { method: "DELETE" });
      card.remove(); refreshStatus();
    } catch (err) { toast(err.message); }
  };

  actions.append(dlWav, dlMp3, del);
  foot.append(src, actions);
  card.append(foot);

  requestAnimationFrame(() => loadWave(e, wave));
  return card;
}

/* ── effects list ────────────────────────────────────────────────────── */
async function refreshList() {
  const q = $("#search").value.trim();
  const params = q ? `?q=${encodeURIComponent(q)}` : `?status=${tab}`;
  const list = $("#list");
  try {
    const effects = await api(`/api/effects${params}`);
    list.replaceChildren();
    if (!effects.length) {
      const d = document.createElement("div");
      d.className = "empty";
      if (q) {
        d.textContent = `Nothing matches "${q}".`;
      } else if (tab === "quarantine") {
        d.textContent = "Quarantine is empty — nothing flagged.";
      } else {
        d.innerHTML = '<div class="big">Your library is empty</div>' +
          "Paste a TikTok or Instagram link above to pull its sound effects." +
          (isPublic
            ? "<br><span style='font-size:12px'>Your library lives in this " +
              "browser — accounts are coming so you can keep it forever.</span>"
            : "");
      }
      list.append(d);
      return;
    }
    effects.forEach(e => list.append(effectCard(e)));
  } catch (err) { toast(err.message); }
}

/* ── find cleaner version ────────────────────────────────────────────── */
async function toggleSimilar(e, card, btn) {
  const existing = card.querySelector(".similar-panel");
  if (existing) {
    existing.remove(); card.classList.remove("expanded");
    btn.textContent = "✨ cleaner"; return;
  }
  const panel = document.createElement("div");
  panel.className = "similar-panel";
  card.append(panel);
  card.classList.add("expanded");
  await searchSimilar(e, card, btn, panel, "");
}

async function searchSimilar(e, card, btn, panel, query) {
  panel.replaceChildren();
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Searching Freesound, ranking by similarity to your sound… (10–30s)";
  panel.append(hint);
  btn.textContent = "…"; btn.disabled = true;

  try {
    const result = await api(
      `/api/effects/${e.id}/similar${query ? `?q=${encodeURIComponent(query)}` : ""}`);
    const candidates = result.candidates;

    // Steering row: show what was searched, let the user re-search.
    const steer = document.createElement("div");
    steer.className = "cand";
    const steerLabel = document.createElement("span");
    steerLabel.className = "by"; steerLabel.textContent = "searched:";
    const steerInput = document.createElement("input");
    steerInput.type = "text";
    steerInput.value = query || result.queries.join(", ");
    steerInput.style.cssText =
      "flex:1;background:var(--surface-2);border:1px solid var(--line);" +
      "border-radius:8px;padding:4px 10px;color:var(--text);font-size:12px;";
    const steerBtn = document.createElement("button");
    steerBtn.className = "chip"; steerBtn.textContent = "search again";
    const go = () => searchSimilar(e, card, btn, panel, steerInput.value.trim());
    steerBtn.onclick = go;
    steerInput.onkeydown = (ev) => { if (ev.key === "Enter") go(); };
    steer.append(steerLabel, steerInput, steerBtn);

    hint.textContent = result.weak
      ? "No close matches found — describe the sound in the box below and search again (e.g. \"soft whoosh transition\")."
      : "Studio versions from Freesound.org, most similar first:";
    panel.append(steer);
    candidates.forEach(c => {
      const d = document.createElement("div");
      d.className = "cand";

      const cplay = document.createElement("button");
      cplay.className = "cplay"; cplay.textContent = "▶";
      cplay.setAttribute("aria-label", "play preview");
      cplay.onclick = () => {
        if (current.btn === cplay) { stopCurrent(); return; }
        stopCurrent();
        const audio = new Audio(`/api/freesound-preview/${c.freesound_id}`);
        audio.onended = stopCurrent;
        audio.play();
        cplay.classList.add("playing"); cplay.textContent = "◼";
        current = { audio, btn: cplay, card: null, canvas: null, effectId: null, raf: null };
      };

      const sim = document.createElement("span");
      sim.className = "sim";
      sim.textContent = `${Math.round(c.similarity * 100)}%`;

      const name = document.createElement("a");
      name.className = "name"; name.textContent = c.name;
      name.href = c.page_url; name.target = "_blank"; name.rel = "noreferrer";

      const by = document.createElement("span");
      by.className = "by";
      by.textContent = `${c.username} · ${c.duration_s.toFixed(1)}s`;

      const lic = document.createElement("span");
      lic.className = "lic" + (c.license === "CC0" ? " cc0" : "");
      lic.textContent = c.license;
      lic.title = c.license === "CC0"
        ? "Public domain — no credit required"
        : "Free to use — credit the author in your video description";

      const grow = document.createElement("div"); grow.className = "grow";

      const add = document.createElement("button");
      add.className = "chip"; add.textContent = "+ add";
      add.onclick = async () => {
        add.disabled = true; add.textContent = "adding…";
        try {
          await post(`/api/effects/${e.id}/import-similar`, c);
          add.textContent = "✓ added";
          toast("Added to library" +
            (c.license !== "CC0" ? ` — remember to credit ${c.username}` : ""));
          refreshStatus();
        } catch (err) {
          add.disabled = false; add.textContent = "+ add";
          toast(err.message);
        }
      };

      d.append(cplay, sim, name, by, lic, grow, add);
      panel.append(d);
    });
    btn.textContent = "hide";
  } catch (err) {
    hint.textContent = err.message;
    btn.textContent = "✨ cleaner";
  } finally {
    btn.disabled = false;
  }
}

/* ── jobs ────────────────────────────────────────────────────────────── */
let pollTimer = null;
async function refreshJobs() {
  try {
    const jobs = await api("/api/jobs");
    const box = $("#jobs");
    const active = jobs.filter(j => j.status === "queued" || j.status === "running");
    const recent = jobs.filter(j => j.status === "done" || j.status === "error").slice(0, 3);
    box.replaceChildren(...[...active, ...recent].map(j => {
      const d = document.createElement("div");
      d.className = "job";
      const target = document.createElement("span");
      target.className = "target"; target.textContent = j.target;
      const state = document.createElement("span");
      state.className = `state-${j.status}`;
      state.textContent =
        j.status === "done"
          ? (j.already_processed ? "already in library"
             : `✓ ${j.effect_count} sound${j.effect_count === 1 ? "" : "s"}`
               + (j.quarantined ? `, ${j.quarantined} flagged` : ""))
          : j.status === "error" ? `✗ ${j.error}` : j.status;
      d.append(target, state);
      if (j.status === "running" && j.log.length) {
        const log = document.createElement("div");
        log.className = "log"; log.textContent = j.log[j.log.length - 1];
        d.append(log);
      }
      return d;
    }));
    const busy = active.length > 0;
    if (busy && !pollTimer) pollTimer = setInterval(refreshJobs, 1500);
    if (!busy && pollTimer) {
      clearInterval(pollTimer); pollTimer = null;
      refreshList(); refreshStatus();
    }
  } catch {}
}

$("#extract-btn").onclick = async () => {
  const target = $("#target").value.trim();
  if (!target) return;
  try {
    await post("/api/jobs", { target });
    $("#target").value = "";
    refreshJobs();
  } catch (err) { toast(err.message); }
};
$("#target").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("#extract-btn").click();
});

/* ── tabs / search / watch ───────────────────────────────────────────── */
$("#tab-library").onclick = () => { tab = "library"; setTab(); };
$("#tab-quarantine").onclick = () => { tab = "quarantine"; setTab(); };
function setTab() {
  $("#tab-library").classList.toggle("active", tab === "library");
  $("#tab-quarantine").classList.toggle("active", tab === "quarantine");
  $("#search").value = "";
  refreshList();
}
let searchTimer = null;
$("#search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(refreshList, 250);
});

$("#watch-toggle").onchange = async (e) => {
  try {
    const state = await post("/api/watch", { enabled: e.target.checked });
    $("#watch-folder").textContent = state.folder || "~/Downloads";
    toast(state.enabled ? `Watching ${state.folder}` : "Watch off");
    if (state.enabled && !pollTimer) pollTimer = setInterval(refreshJobs, 1500);
  } catch (err) { toast(err.message); e.target.checked = !e.target.checked; }
};

async function init() {
  await refreshStatus();
  try {
    const w = await api("/api/watch");
    $("#watch-toggle").checked = w.enabled;
    if (w.folder) $("#watch-folder").textContent = w.folder;
  } catch {}
  await refreshList();
  await refreshJobs();
  setInterval(refreshJobs, 5000);
}
init();
</script>
