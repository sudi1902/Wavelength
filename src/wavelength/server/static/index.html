<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavelength — Sound Effects Library</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e2230; --line: #2a2f3e;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #6ea8fe; --accent2: #9b8cff;
    --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 17px; letter-spacing: .4px; }
  header h1 span { color: var(--accent); }
  .stats { color: var(--dim); font-size: 12px; }
  main { max-width: 1060px; margin: 0 auto; padding: 20px 22px 80px; }

  .extract-box {
    display: flex; gap: 8px; margin-bottom: 18px;
  }
  .extract-box input[type=text] {
    flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  .extract-box input:focus { outline: 1px solid var(--accent); }
  button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b0d12; font-weight: 600; border: none; }
  button.small { padding: 3px 9px; font-size: 12px; }
  button.icon { padding: 3px 8px; font-size: 14px; line-height: 1.2; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; }
  .tabs button.active { background: var(--accent); color: #0b0d12; font-weight: 600; border: none; }
  #search { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); width: 230px; }
  .watch { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }

  .row {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .row-top { display: flex; align-items: center; gap: 10px; }
  .play {
    width: 34px; height: 34px; border-radius: 50%; border: none; flex: none;
    background: var(--accent); color: #0b0d12; font-size: 14px; cursor: pointer;
  }
  .play.playing { background: var(--accent2); }
  .label { font-weight: 600; min-width: 110px; }
  .label input { background: var(--panel2); border: 1px solid var(--accent);
    color: var(--text); border-radius: 6px; padding: 2px 6px; width: 130px; }
  .meta { color: var(--dim); font-size: 12px; }
  .fav { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--dim); }
  .fav.on { color: var(--warn); }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { background: var(--panel2); border-radius: 999px; padding: 1px 9px;
    font-size: 11px; color: var(--accent); }
  .grow { flex: 1; }
  .actions { display: flex; gap: 6px; flex: none; }
  .reason { color: var(--warn); font-size: 12px; }
  canvas.wave { width: 100%; height: 44px; display: block; margin-top: 8px;
    background: var(--panel2); border-radius: 6px; cursor: pointer; }
  .source-line { color: var(--dim); font-size: 11px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source-line a { color: var(--dim); }

  .jobs { margin-bottom: 18px; }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; margin-bottom: 6px; font-size: 12px; }
  .job .target { color: var(--text); font-weight: 600; }
  .job .state-running { color: var(--accent); }
  .job .state-done { color: var(--good); }
  .job .state-error { color: var(--bad); }
  .job .log { color: var(--dim); margin-top: 2px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--accent); color: var(--text);
    border-radius: 8px; padding: 8px 18px; z-index: 10; }
</style>
</head>
<body>
<header>
  <h1>wave<span>length</span></h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="extract-box">
    <input type="text" id="target" placeholder="Paste a TikTok / Instagram link or a file path, then hit Extract…">
    <button class="primary" id="extract-btn">Extract</button>
  </div>

  <div class="jobs" id="jobs"></div>

  <div class="toolbar">
    <div class="tabs">
      <button id="tab-library" class="active">Library</button>
      <button id="tab-quarantine">Quarantine <span id="qcount"></span></button>
    </div>
    <input type="text" id="search" placeholder="Search labels, tags, sources…">
    <label class="watch">
      <input type="checkbox" id="watch-toggle"> watch&nbsp;<span id="watch-folder">~/Downloads</span>
    </label>
  </div>

  <div id="list"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let tab = "library";
let audioCtx = null;
let current = { audio: null, btn: null };
const waveCache = new Map();

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}),
});

// ---------- status ----------
async function refreshStatus() {
  try {
    const s = await api("/api/status");
    $("#stats").textContent =
      `${s.library_count} effects · ${s.quarantine_count} in quarantine · ` +
      `engine ${s.engine}${s.engine_ready ? "" : " (not set up)"} · ` +
      `labels ${s.labeler_ready ? "on" : "off"}`;
    $("#qcount").textContent = s.quarantine_count ? `(${s.quarantine_count})` : "";
  } catch {}
}

// ---------- playback + waveform ----------
function stopCurrent() {
  if (current.audio) { current.audio.pause(); current.audio = null; }
  if (current.btn) { current.btn.classList.remove("playing"); current.btn.textContent = "▶"; }
  current.btn = null;
}

function playEffect(id, btn) {
  if (current.btn === btn) { stopCurrent(); return; }
  stopCurrent();
  const audio = new Audio(`/api/effects/${id}/audio`);
  audio.onended = stopCurrent;
  audio.play();
  btn.classList.add("playing"); btn.textContent = "◼";
  current = { audio, btn };
}

async function drawWave(id, canvas) {
  try {
    let peaks = waveCache.get(id);
    if (!peaks) {
      const buf = await (await fetch(`/api/effects/${id}/audio`)).arrayBuffer();
      audioCtx = audioCtx || new AudioContext();
      const decoded = await audioCtx.decodeAudioData(buf);
      const data = decoded.getChannelData(0);
      const n = 240, step = Math.floor(data.length / n) || 1;
      peaks = [];
      for (let i = 0; i < n; i++) {
        let max = 0;
        for (let j = i * step; j < (i + 1) * step && j < data.length; j++) {
          const v = Math.abs(data[j]); if (v > max) max = v;
        }
        peaks.push(max);
      }
      waveCache.set(id, peaks);
    }
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr; canvas.height = 44 * dpr;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#6ea8fe";
    const w = canvas.width / peaks.length;
    peaks.forEach((p, i) => {
      const h = Math.max(2, p * canvas.height * 0.92);
      ctx.fillRect(i * w, (canvas.height - h) / 2, Math.max(1, w - 1.2), h);
    });
  } catch {}
}

// ---------- effects list ----------
function effectRow(e) {
  const row = document.createElement("div");
  row.className = "row";
  const top = document.createElement("div");
  top.className = "row-top";

  const play = document.createElement("button");
  play.className = "play"; play.textContent = "▶";
  play.onclick = () => playEffect(e.id, play);

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = e.label || "unlabeled";
  label.title = "Double-click to rename";
  label.ondblclick = () => {
    const input = document.createElement("input");
    input.value = e.label || "";
    label.replaceChildren(input); input.focus();
    const save = async () => {
      try {
        const updated = await post(`/api/effects/${e.id}/rename`, { label: input.value });
        label.textContent = updated.label || "unlabeled";
        toast("Renamed");
      } catch (err) { toast(err.message); label.textContent = e.label || "unlabeled"; }
    };
    input.onkeydown = (ev) => { if (ev.key === "Enter") input.blur(); if (ev.key === "Escape") { input.value = e.label || ""; input.blur(); } };
    input.onblur = save;
  };

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${e.duration_s.toFixed(2)}s · ${(e.sample_rate/1000).toFixed(1)}k` +
    (e.confidence ? ` · ${(e.confidence * 100).toFixed(0)}%` : "");

  const tags = document.createElement("div");
  tags.className = "tags";
  const renderTags = (list) => {
    tags.replaceChildren(...list.map(t => {
      const s = document.createElement("span"); s.className = "tag"; s.textContent = t; return s;
    }));
  };
  renderTags(e.tags);
  tags.title = "Click to edit tags";
  tags.onclick = async () => {
    const val = prompt("Tags (comma-separated):", e.tags.join(","));
    if (val === null) return;
    try {
      const updated = await post(`/api/effects/${e.id}/tags`,
        { tags: val.split(",").map(t => t.trim()).filter(Boolean) });
      e.tags = updated.tags; renderTags(e.tags);
    } catch (err) { toast(err.message); }
  };
  if (!e.tags.length) {
    const s = document.createElement("span");
    s.className = "tag"; s.style.opacity = .45; s.textContent = "+ tags";
    tags.appendChild(s);
  }

  const grow = document.createElement("div"); grow.className = "grow";

  const fav = document.createElement("button");
  fav.className = "fav" + (e.favorite ? " on" : ""); fav.textContent = "★";
  fav.onclick = async () => {
    try {
      const updated = await post(`/api/effects/${e.id}/favorite`, { favorite: !e.favorite });
      e.favorite = updated.favorite; fav.classList.toggle("on", e.favorite);
    } catch (err) { toast(err.message); }
  };

  const actions = document.createElement("div");
  actions.className = "actions";
  const dlWav = document.createElement("a");
  dlWav.href = `/api/effects/${e.id}/download`;
  dlWav.innerHTML = '<button class="small">wav</button>';
  const dlMp3 = document.createElement("a");
  dlMp3.href = `/api/effects/${e.id}/download?mp3=1`;
  dlMp3.innerHTML = '<button class="small">mp3</button>';
  actions.append(dlWav, dlMp3);

  if (e.status === "quarantine") {
    const promote = document.createElement("button");
    promote.className = "small"; promote.textContent = "promote";
    promote.onclick = async () => {
      try { await post(`/api/effects/${e.id}/promote`); row.remove(); refreshStatus(); toast("Promoted to library"); }
      catch (err) { toast(err.message); }
    };
    actions.append(promote);
  }

  const del = document.createElement("button");
  del.className = "small danger"; del.textContent = "delete";
  del.onclick = async () => {
    if (!confirm(`Delete ${e.filename}?`)) return;
    try {
      await api(`/api/effects/${e.id}`, { method: "DELETE" });
      row.remove(); refreshStatus();
    } catch (err) { toast(err.message); }
  };
  actions.append(del);

  top.append(play, label, meta, tags, grow, fav, actions);
  row.append(top);

  if (e.status === "quarantine" && e.quarantine_reason) {
    const r = document.createElement("div");
    r.className = "reason"; r.textContent = `flagged as ${e.quarantine_reason}`;
    row.append(r);
  }

  const wave = document.createElement("canvas");
  wave.className = "wave";
  wave.onclick = () => playEffect(e.id, play);
  row.append(wave);

  const src = document.createElement("div");
  src.className = "source-line";
  const title = e.source.title || e.source.filename;
  const by = e.source.uploader ? ` — @${e.source.uploader}` : "";
  if (e.source.url) {
    src.innerHTML = `from <a href="${e.source.url}" target="_blank" rel="noreferrer"></a>`;
    src.querySelector("a").textContent = title + by;
  } else {
    src.textContent = `from ${title}${by}`;
  }
  row.append(src);

  requestAnimationFrame(() => drawWave(e.id, wave));
  return row;
}

async function refreshList() {
  const q = $("#search").value.trim();
  const params = q ? `?q=${encodeURIComponent(q)}` : `?status=${tab}`;
  const list = $("#list");
  try {
    const effects = await api(`/api/effects${params}`);
    list.replaceChildren();
    if (!effects.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = q ? "No matches." :
        tab === "quarantine" ? "Quarantine is empty." :
        "No effects yet — paste a TikTok link above.";
      list.append(d);
      return;
    }
    effects.forEach(e => list.append(effectRow(e)));
  } catch (err) { toast(err.message); }
}

// ---------- jobs ----------
let pollTimer = null;
async function refreshJobs() {
  try {
    const jobs = await api("/api/jobs");
    const box = $("#jobs");
    const active = jobs.filter(j => j.status === "queued" || j.status === "running");
    const recent = jobs.filter(j => j.status !== "queued" && j.status !== "running").slice(0, 3);
    box.replaceChildren(...[...active, ...recent].map(j => {
      const d = document.createElement("div");
      d.className = "job";
      const state = document.createElement("span");
      state.className = `state-${j.status}`;
      state.textContent =
        j.status === "done"
          ? (j.already_processed ? " already in library" :
             ` ✓ ${j.effect_count} effect(s)` + (j.quarantined ? `, ${j.quarantined} quarantined` : ""))
          : j.status === "error" ? ` ✗ ${j.error}` : ` ${j.status}`;
      const target = document.createElement("span");
      target.className = "target";
      target.textContent = j.target.length > 80 ? j.target.slice(0, 80) + "…" : j.target;
      d.append(target, state);
      if (j.status === "running" && j.log.length) {
        const log = document.createElement("div");
        log.className = "log"; log.textContent = j.log[j.log.length - 1];
        d.append(log);
      }
      return d;
    }));
    const busy = active.length > 0;
    if (busy && !pollTimer) pollTimer = setInterval(async () => {
      await refreshJobs();
    }, 1500);
    if (!busy && pollTimer) {
      clearInterval(pollTimer); pollTimer = null;
      refreshList(); refreshStatus();
    }
  } catch {}
}

$("#extract-btn").onclick = async () => {
  const target = $("#target").value.trim();
  if (!target) return;
  try {
    await post("/api/jobs", { target });
    $("#target").value = "";
    refreshJobs();
  } catch (err) { toast(err.message); }
};
$("#target").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("#extract-btn").click();
});

// ---------- tabs / search / watch ----------
$("#tab-library").onclick = () => { tab = "library"; setTab(); };
$("#tab-quarantine").onclick = () => { tab = "quarantine"; setTab(); };
function setTab() {
  $("#tab-library").classList.toggle("active", tab === "library");
  $("#tab-quarantine").classList.toggle("active", tab === "quarantine");
  $("#search").value = "";
  refreshList();
}
let searchTimer = null;
$("#search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(refreshList, 250);
});

$("#watch-toggle").onchange = async (e) => {
  try {
    const state = await post("/api/watch", { enabled: e.target.checked });
    $("#watch-folder").textContent = state.folder || "~/Downloads";
    toast(state.enabled ? `Watching ${state.folder}` : "Watch off");
    if (state.enabled) { if (!pollTimer) pollTimer = setInterval(refreshJobs, 1500); }
  } catch (err) { toast(err.message); e.target.checked = !e.target.checked; }
};

async function init() {
  await refreshStatus();
  try {
    const w = await api("/api/watch");
    $("#watch-toggle").checked = w.enabled;
    if (w.folder) $("#watch-folder").textContent = w.folder;
  } catch {}
  await refreshList();
  await refreshJobs();
  // Slow background poll so watch-folder jobs surface without interaction.
  setInterval(refreshJobs, 5000);
}
init();
</script>
</body>
</html>
